name: Build and Release

on:
  pull_request:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  configuration:
    name: Release configuration
    runs-on: ubuntu-latest
    outputs:
      signed: ${{ steps.signing.outputs.enabled }}
      cliproxy_tag: ${{ steps.cliproxy.outputs.tag }}
    steps:
      - name: Resolve CLIProxyAPI release
        id: cliproxy
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "tag=$(gh release view --repo router-for-me/CLIProxyAPI --json tagName --jq .tagName)" >> "$GITHUB_OUTPUT"

      - name: Detect Apple signing credentials
        id: signing
        env:
          CERTIFICATE: ${{ secrets.APPLE_DEVELOPER_CERTIFICATE_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DEVELOPER_CERTIFICATE_PASSWORD }}
          CODESIGN_IDENTITY: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          if [ -n "$CERTIFICATE" ] &&
             [ -n "$CERTIFICATE_PASSWORD" ] &&
             [ -n "$CODESIGN_IDENTITY" ] &&
             [ -n "$APPLE_ID" ] &&
             [ -n "$APPLE_TEAM_ID" ] &&
             [ -n "$APPLE_APP_PASSWORD" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

  package:
    name: Package macOS app (${{ matrix.arch }})
    needs: configuration
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            asset_pattern: "darwin_(aarch64|arm64)"
          - arch: x86_64
            asset_pattern: "darwin_amd64"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve app version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="0.0.${GITHUB_RUN_NUMBER}"
          fi
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Download CLIProxyAPI
        env:
          GH_TOKEN: ${{ github.token }}
          ASSET_PATTERN: ${{ matrix.asset_pattern }}
          CLIPROXY_TAG: ${{ needs.configuration.outputs.cliproxy_tag }}
        run: |
          set -euo pipefail

          RELEASE_JSON="$(gh api "repos/router-for-me/CLIProxyAPI/releases/tags/$CLIPROXY_TAG")"
          ASSET="$(jq -c --arg pattern "$ASSET_PATTERN" \
            '.assets[] | select(.name | test("^CLIProxyAPI_.+_" + $pattern + "\\.tar\\.gz$"))' \
            <<< "$RELEASE_JSON" | head -n 1)"

          if [ -z "$ASSET" ]; then
            echo "No CLIProxyAPI asset matched $ASSET_PATTERN" >&2
            exit 1
          fi

          URL="$(jq -r '.browser_download_url' <<< "$ASSET")"
          EXPECTED_DIGEST="$(jq -r '.digest // empty' <<< "$ASSET")"
          curl --fail --location --retry 3 --output cliproxy.tar.gz "$URL"

          if [[ "$EXPECTED_DIGEST" != sha256:* ]]; then
            echo "The upstream asset does not provide a SHA-256 digest" >&2
            exit 1
          fi
          echo "${EXPECTED_DIGEST#sha256:}  cliproxy.tar.gz" | shasum -a 256 --check

          EXTRACT_DIR="$(mktemp -d)"
          tar -xzf cliproxy.tar.gz -C "$EXTRACT_DIR"
          BINARY="$(find "$EXTRACT_DIR" -type f \
            \( -name CLIProxyAPI -o -name cli-proxy-api -o -name CLIProxyAPIPlus -o -name cli-proxy-api-plus \) \
            | head -n 1)"

          if [ -z "$BINARY" ]; then
            echo "The downloaded archive does not contain CLIProxyAPI" >&2
            exit 1
          fi

          cp "$BINARY" src/Sources/Resources/cli-proxy-api-plus
          chmod +x src/Sources/Resources/cli-proxy-api-plus
          file src/Sources/Resources/cli-proxy-api-plus | grep -q "${{ matrix.arch }}"

      - name: Import Apple signing certificate
        if: needs.configuration.outputs.signed == 'true'
        uses: apple-actions/import-codesign-certs@v7
        with:
          p12-file-base64: ${{ secrets.APPLE_DEVELOPER_CERTIFICATE_P12_BASE64 }}
          p12-password: ${{ secrets.APPLE_DEVELOPER_CERTIFICATE_PASSWORD }}

      - name: Build app bundle
        env:
          APP_VERSION: ${{ steps.version.outputs.value }}
          CODESIGN_IDENTITY: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION }}
          TARGET_ARCH: ${{ matrix.arch }}
        run: make app

      - name: Notarize app bundle
        if: needs.configuration.outputs.signed == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          ditto -c -k --sequesterRsrc --keepParent VibeProxy.app VibeProxy-notarize.zip
          xcrun notarytool submit VibeProxy-notarize.zip \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_PASSWORD" \
            --wait
          xcrun stapler staple VibeProxy.app
          xcrun stapler validate VibeProxy.app
          rm VibeProxy-notarize.zip

      - name: Package app bundle
        env:
          TARGET_ARCH: ${{ matrix.arch }}
        run: ./package-release.sh

      - name: Verify release archive
        env:
          TARGET_ARCH: ${{ matrix.arch }}
        run: |
          unzip -t "dist/VibeProxy-${TARGET_ARCH}.zip"
          VERIFY_DIR="$(mktemp -d)"
          ditto -x -k "dist/VibeProxy-${TARGET_ARCH}.zip" "$VERIFY_DIR"
          plutil -lint "$VERIFY_DIR/VibeProxy.app/Contents/Info.plist"
          codesign --verify --deep --strict "$VERIFY_DIR/VibeProxy.app"
          (
            cd dist
            shasum -a 256 --check "VibeProxy-${TARGET_ARCH}.zip.sha256"
          )

      - name: Upload release package
        uses: actions/upload-artifact@v7
        with:
          name: VibeProxy-${{ matrix.arch }}
          path: |
            dist/VibeProxy-${{ matrix.arch }}.zip
            dist/VibeProxy-${{ matrix.arch }}.zip.sha256
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - configuration
      - package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release packages
        uses: actions/download-artifact@v8
        with:
          pattern: VibeProxy-*
          path: release
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNED: ${{ needs.configuration.outputs.signed }}
        run: |
          if [ "$SIGNED" = "true" ]; then
            INSTALL_NOTE="These builds are signed with Apple Developer ID and notarized."
          else
            INSTALL_NOTE="These builds are ad-hoc signed. If macOS blocks the first launch, right-click VibeProxy.app and choose Open."
          fi

          gh release create "$GITHUB_REF_NAME" release/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "VibeProxy ${GITHUB_REF_NAME#v}" \
            --notes "$INSTALL_NOTE" \
            --generate-notes
